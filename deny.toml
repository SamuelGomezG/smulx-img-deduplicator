[graph]
all-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0080", reason = "transpose 0.1.0 buffer overflow. Transitive dep via img_hash -> rustdct -> rustfft. Cannot upgrade without upstream update." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
