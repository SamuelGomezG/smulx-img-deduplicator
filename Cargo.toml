[package]
name = "smulx-img-deduplicator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "smulx-dedup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
img_hash = "3.2.0"
jwalk = "0.8.1"
open = "5.3.4"
ratatui = "0.30.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.6"

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "clustering_benchmark"
harness = false
